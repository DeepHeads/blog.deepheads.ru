name: Build and deploy Hugo site

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  HUGO_VERSION: "0.169.0"
  HUGO_ENV: production

jobs:
  # Build runs on GitHub-hosted runners: safe for PRs from forks.
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Hugo (extended)
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Show Hugo version
        run: hugo version

      - name: Build site
        run: hugo --minify --gc --baseURL "${{ vars.HUGO_BASEURL || 'https://blog.deepheads.ru/' }}"

      - name: Check build output
        run: |
          test -f public/index.html || { echo "::error::public/index.html not found"; exit 1; }
          echo "Built $(find public -type f | wc -l) files, $(du -sh public | cut -f1) total"

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: hugo-site
          path: public
          if-no-files-found: error
          retention-days: 14

  # Deploy runs on the self-hosted runner, only for main after a successful build.
  deploy:
    name: Deploy
    needs: build
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, linux, x64, deploy]
    timeout-minutes: 10
    concurrency:
      group: deploy-blog
      cancel-in-progress: false
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: hugo-site
          path: site

      - name: Deploy to webroot
        run: |
          set -euo pipefail
          DEST=/home/ubuntu/blog.deepheads.ru
          test -f site/index.html || { echo "::error::artifact has no index.html"; exit 1; }
          # no -a: the webroot has dirs owned by other users, we may only write content
          rsync -rlt --delete --omit-dir-times --chmod=D755,F644 --stats site/ "$DEST"/
          test -f "$DEST/index.html"
          echo "Deployed $(find "$DEST" -type f | wc -l) files"

      - name: Verify live site
        run: |
          set -euo pipefail
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 \
            --resolve blog.deepheads.ru:443:127.0.0.1 https://blog.deepheads.ru/)
          echo "https://blog.deepheads.ru/ -> $code"
          test "$code" = "200"
